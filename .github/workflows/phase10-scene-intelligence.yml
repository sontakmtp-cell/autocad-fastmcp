name: Phase 10 Scene Intelligence

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  phase10-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run deterministic Phase 10 conformance
        run: python scripts/test-phase10-conformance.py
      - name: Validate retained live evidence
        run: python scripts/validate-phase10-live-evidence.py

  portal-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web_portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web_portal/package-lock.json
      - run: npm ci
      - name: Test strict read-only scene projections
        run: npm test -- --run tests/unit/phase10-scenes.test.ts tests/unit/gateway-client.test.ts
      - name: Compile Portal scene routes
        run: npm run build

  phase9-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Preserve Phase 9 workflow conformance
        run: python scripts/test-phase9-conformance.py

  phase8-python-regression:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Sync isolated Gateway test environment
        run: uv sync --project services/gateway --group test --reinstall-package autocad-contracts
      - name: Preserve Phase 8 Python conformance
        run: >-
          uv run --project services/gateway python -m pytest -q tests/phase8
          --basetemp=phase8-phase10-ci-tmp

  managed-host-regression:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Preserve Host Core Phase 8 and Phase 10 contracts
        run: >-
          dotnet test
          native/autocad_managed_host/tests/AutocadMcp.Host.Core.Tests/AutocadMcp.Host.Core.Tests.csproj
          --configuration Release

  # Autodesk references are proprietary and intentionally absent in CI.
  # Live R25 evidence is collected on the bounded Windows lab profile.
  # This workflow never builds the standalone Desktop Agent executable.
